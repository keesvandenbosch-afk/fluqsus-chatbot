<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluqsus Assistent</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:      #143347;
    --deep:      #152b38;
    --mid:       #1A3D54;
    --blue:      #2E8BC0;
    --bglow:     rgba(46,139,192,0.15);
    --orange:    #F4A030;
    --text:      rgba(255,255,255,0.92);
    --muted:     rgba(255,255,255,0.45);
    --border:    rgba(255,255,255,0.08);
    --bordermid: rgba(46,139,192,0.25);
    --surface:   rgba(255,255,255,0.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    font-family: 'DM Sans', sans-serif;
    background: var(--deep);
  }

  .chat {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--deep);
    position: relative;
    overflow: hidden;
  }

  .chat::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 80% 5%, rgba(46,139,192,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 5% 90%, rgba(244,160,48,0.06) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }

  .accent {
    height: 3px;
    background: linear-gradient(90deg, var(--orange), var(--blue), transparent);
    flex-shrink: 0; position: relative; z-index: 2;
  }

  /* HEADER */
  .header {
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
    background: rgba(21,43,56,0.8);
    backdrop-filter: blur(12px);
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0; position: relative; z-index: 2;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--blue) 0%, var(--orange) 100%);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: white;
    box-shadow: 0 4px 14px rgba(46,139,192,0.3); flex-shrink: 0;
  }
  .hinfo h2 { font-size: 15px; font-weight: 600; color: var(--text); }
  .hinfo p  { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .hstatus  { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
  .hdot     { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 7px rgba(74,222,128,0.6); animation: breathe 2.5s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{opacity:1}50%{opacity:0.4} }

  /* MESSAGES */
  .messages {
    flex: 1; overflow-y: auto; padding: 20px 16px;
    display: flex; flex-direction: column; gap: 16px;
    position: relative; z-index: 1; scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 3px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  .msg { display: flex; gap: 10px; animation: rise 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards; opacity: 0; }
  @keyframes rise { from{opacity:0;transform:translateY(10px) scale(0.97)}to{opacity:1;transform:none} }
  .msg.user { flex-direction: row-reverse; }

  .av {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; align-self: flex-end;
  }
  .msg.ai .av {
    background: linear-gradient(135deg, var(--orange) 0%, #e08820 100%);
    box-shadow: 0 3px 10px rgba(244,160,48,0.45);
    padding: 5px;
  }
  .msg.user .av {
    background: linear-gradient(135deg, var(--blue), #1a6d9e);
    box-shadow: 0 3px 10px rgba(46,139,192,0.3);
    font-size: 16px;
  }

  .mbody { max-width: 75%; display: flex; flex-direction: column; gap: 5px; }
  .msg.user .mbody { align-items: flex-end; }

  .bubble { padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.65; }
  .msg.ai   .bubble { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
  .msg.user .bubble { background: linear-gradient(135deg, var(--blue), #1a6d9e); color: white; border-bottom-right-radius: 4px; box-shadow: 0 4px 16px rgba(46,139,192,0.25); }

  .mtime { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; padding: 0 3px; }

  /* TYPING */
  .typing .bubble { display: flex; gap: 6px; align-items: center; padding: 14px 18px; }
  .typing .bubble span { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); animation: dot 1.3s ease-in-out infinite; opacity: 0.4; }
  .typing .bubble span:nth-child(2){animation-delay:0.2s}
  .typing .bubble span:nth-child(3){animation-delay:0.4s}
  @keyframes dot{0%,100%{transform:translateY(0);opacity:0.4}40%{transform:translateY(-6px);opacity:1}}

  /* SUGGESTIONS */
  .sugs { padding: 0 16px 12px; display: flex; gap: 8px; flex-wrap: wrap; position: relative; z-index: 1; flex-shrink: 0; }
  .sug {
    padding: 7px 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 20px;
    font-size: 12.5px; font-family: 'DM Sans', sans-serif;
    color: var(--muted); cursor: pointer; transition: all 0.2s;
  }
  .sug:hover { background: var(--bglow); border-color: var(--bordermid); color: var(--blue); }

  /* INPUT */
  .input-area {
    border-top: 1px solid var(--border); padding: 14px 16px;
    display: flex; gap: 10px; align-items: flex-end;
    background: rgba(21,43,56,0.85); backdrop-filter: blur(12px);
    position: relative; z-index: 2; flex-shrink: 0;
  }
  .inwrap {
    flex: 1; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 14px; display: flex; align-items: flex-end; transition: all 0.2s;
  }
  .inwrap:focus-within { border-color: var(--bordermid); background: rgba(255,255,255,0.07); }
  textarea {
    flex: 1; background: transparent; border: none; outline: none;
    padding: 12px 14px; font-family: 'DM Sans', sans-serif;
    font-size: 14px; color: var(--text); resize: none; max-height: 100px; line-height: 1.45;
  }
  textarea::placeholder { color: var(--muted); }

  .sendbtn {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--blue), #1a6d9e);
    border: none; border-radius: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(46,139,192,0.3);
  }
  .sendbtn:hover  { transform: scale(1.07); box-shadow: 0 6px 18px rgba(46,139,192,0.4); }
  .sendbtn:active { transform: scale(0.95); }

  .footnote {
    text-align: center; font-size: 10px; color: var(--muted);
    padding: 6px 0 10px; font-family: 'DM Mono', monospace;
    position: relative; z-index: 2; flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="chat">
  <div class="accent"></div>

  <div class="header">
    <div class="logo">fq</div>
    <div class="hinfo">
      <h2>Fluqsus Assistent</h2>
      <p>Stel een vraag over Fluqsus of AFAS</p>
    </div>
    <div class="hstatus"><div class="hdot"></div>online</div>
  </div>

  <div class="messages" id="messages">
    <div class="msg ai">
      <div class="av">
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="13" r="8" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1.8"/>
          <circle cx="12.5" cy="12" r="1.8" fill="white"/>
          <circle cx="19.5" cy="12" r="1.8" fill="white"/>
          <path d="M12 16.5 Q16 20 20 16.5" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <rect x="14" y="21" width="4" height="3" rx="1" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1.5"/>
          <path d="M8 29 Q8 25 16 25 Q24 25 24 29" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <line x1="16" y1="5" x2="16" y2="2" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="16" cy="1.2" r="1.2" fill="rgba(255,255,255,0.6)"/>
        </svg>
      </div>
      <div class="mbody">
        <div class="bubble">Hallo! Ik help je graag met vragen over <strong>Fluqsus</strong> en <strong>AFAS</strong>. Wat wil je weten?</div>
        <div class="mtime">nu</div>
      </div>
    </div>
  </div>

  <div class="sugs" id="sugs">
    <button class="sug" onclick="useSug(this)">Wat doet Fluqsus?</button>
    <button class="sug" onclick="useSug(this)">Verlofaanvraag indienen</button>
    <button class="sug" onclick="useSug(this)">Autorisaties instellen</button>
    <button class="sug" onclick="useSug(this)">Contact opnemen</button>
  </div>

  <div class="input-area">
    <div class="inwrap">
      <textarea id="inp" rows="1" placeholder="Typ je vraag..."
        onkeydown="onKey(event)" oninput="resize(this)"></textarea>
    </div>
    <button class="sendbtn" onclick="send()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
  <div class="footnote">fluqsus.nl · antwoorden via AFAS help &amp; eigen documentatie</div>
</div>

<script>
const BACKEND = 'https://fluqsus-chatbot.vercel.app/api/chat';

const AI_AVATAR = `<svg width="26" height="26" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="16" cy="13" r="8" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1.8"/>
  <circle cx="12.5" cy="12" r="1.8" fill="white"/>
  <circle cx="19.5" cy="12" r="1.8" fill="white"/>
  <path d="M12 16.5 Q16 20 20 16.5" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <rect x="14" y="21" width="4" height="3" rx="1" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1.5"/>
  <path d="M8 29 Q8 25 16 25 Q24 25 24 29" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <line x1="16" y1="5" x2="16" y2="2" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="1.2" r="1.2" fill="rgba(255,255,255,0.6)"/>
</svg>`;

function mdToHtml(text) {
  return text
    .replace(/^### (.+)$/gm, '<div style="font-size:11px;font-weight:600;opacity:0.6;text-transform:uppercase;letter-spacing:0.05em;margin-top:10px;margin-bottom:4px;">$1</div>')
    .replace(/^## (.+)$/gm, '<div style="font-weight:600;margin-top:8px;margin-bottom:4px;">$1</div>')
    .replace(/^# (.+)$/gm, '<div style="font-weight:700;margin-bottom:6px;">$1</div>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^[\-–—] (.+)$/gm, '<div style="display:flex;gap:6px;padding:2px 0;"><span style="color:var(--blue);flex-shrink:0;">•</span><span>$1</span></div>')
    .replace(/^[✅📧📞🌐🏢] (.+)$/gm, '<div style="display:flex;gap:6px;padding:2px 0;"><span style="color:var(--blue);flex-shrink:0;">•</span><span>$1</span></div>')
    .replace(/^• (.+)$/gm, '<div style="display:flex;gap:6px;padding:2px 0;"><span style="color:var(--blue);flex-shrink:0;">•</span><span>$1</span></div>')
    .replace(/^\d+\. (.+)$/gm, '<div style="padding:2px 0;">$1</div>')
    .replace(/---+/g, '<hr style="border:none;border-top:1px solid rgba(255,255,255,0.1);margin:8px 0;">')
    .replace(/\n\n/g, '<div style="height:6px;"></div>')
    .replace(/\n/g, '<br>');
}


function resize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}
function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}
function useSug(btn) {
  document.getElementById('inp').value = btn.textContent;
  document.getElementById('sugs').style.display = 'none';
  send();
}
function now() {
  return new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
}
function addMsg(role, html) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const av = document.createElement('div');
  av.className = 'av';
  if (role === 'ai') {
    av.innerHTML = AI_AVATAR;
  } else {
    av.textContent = '👤';
  }
  const body = document.createElement('div');
  body.className = 'mbody';
  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.innerHTML = mdToHtml(html);
  body.appendChild(bub);
  const t = document.createElement('div');
  t.className = 'mtime';
  t.textContent = now();
  body.appendChild(t);
  wrap.appendChild(av);
  wrap.appendChild(body);
  const msgs = document.getElementById('messages');
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}
function showTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg ai typing';
  wrap.id = 'typing';
  const av = document.createElement('div');
  av.className = 'av';
  av.innerHTML = AI_AVATAR;
  const body = document.createElement('div');
  body.className = 'mbody';
  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.innerHTML = '<span></span><span></span><span></span>';
  body.appendChild(bub);
  wrap.appendChild(av);
  wrap.appendChild(body);
  const msgs = document.getElementById('messages');
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}
function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}
async function send() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  inp.style.height = 'auto';
  document.getElementById('sugs').style.display = 'none';
  addMsg('user', text);
  showTyping();
  try {
    const res = await fetch(BACKEND, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text })
    });
    removeTyping();
    if (!res.ok) throw new Error('Fout ' + res.status);
    const data = await res.json();
    addMsg('ai', data.answer);
  } catch (err) {
    removeTyping();
    addMsg('ai', '&#9888; Kon geen verbinding maken. Probeer het opnieuw.');
  }
}
</script>
</body>
</html>
